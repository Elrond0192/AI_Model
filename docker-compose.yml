services:
  api:
    build: .
    image: basketball-ai:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATA_SOURCE: postgres
      MODEL_DIR: /app/models_saved/production
      DATABASE_PROFILES_FILE: /app/config/database_profiles.json
      API_ENV: production
      LOG_FORMAT: json
      AUDIT_DB_PATH: /app/runtime/audit/audit.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./runtime/config:/app/config:ro
      - ./runtime/models:/app/models_saved:ro
      - ./runtime/audit:/app/runtime/audit:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  ops:
    build: .
    image: basketball-ai:latest
    profiles: ["ops"]
    env_file: [.env]
    environment:
      DATA_SOURCE: postgres
      MODEL_DIR: /app/models_saved
      DATABASE_PROFILES_FILE: /app/config/database_profiles.json
    volumes:
      - ./runtime/config:/app/config:rw
      - ./runtime/models:/app/models_saved:rw
      - ./runtime/audit:/app/runtime/audit:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
