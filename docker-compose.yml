services:
  api:
    build: .
    image: basketball-ai-api:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATA_SOURCE: postgres
      MODEL_DIR: /app/models_saved/production
      DATABASE_PROFILES_FILE: /app/config/database_profiles.json
      API_ENV: production
      LOG_FORMAT: json
      CHAT_DEBUG_ENABLED: "true"
      AUDIT_DB_PATH: /app/runtime/audit/audit.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./runtime/config:/app/config:ro
      - ./runtime/models:/app/models_saved:ro
      - ./runtime/auth:/app/runtime/auth:rw
      - ./runtime/audit:/app/runtime/audit:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  admin:
    build: .
    image: basketball-ai-admin:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATA_SOURCE: postgres
      MODEL_DIR: /app/models_saved
      DATABASE_PROFILES_FILE: /app/config/database_profiles.json
      BASKETBALL_AI_USERS_FILE: /app/runtime/auth/users.json
      BASKETBALL_AI_ROLES_FILE: /app/runtime/auth/roles.json
      BASKETBALL_AI_SESSIONS_FILE: /app/runtime/auth/sessions.json
      BASKETBALL_AI_ADMIN_CREDENTIALS_FILE: /app/runtime/auth/.admin_credentials
      BASKETBALL_AI_AUDIT_LOG: /app/runtime/audit/admin-audit.log
      ADMIN_API_BASE_URL: http://api:8000
      POSTGRES_INCLUDE_OPTIONAL: "false"
      POSTGRES_LOAD_WORKERS: "4"
      MODEL_CPU_THREADS: "8"
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./runtime/config:/app/config:rw
      - ./runtime/models:/app/models_saved:rw
      - ./runtime/auth:/app/runtime/auth:rw
      - ./runtime/audit:/app/runtime/audit:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "basketball_ai.admin_web.app:app", "--host", "0.0.0.0", "--port", "8501", "--workers", "1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
