name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

# Minimal permissions for all jobs by default
permissions:
  contents: read

jobs:
  # ─── test ────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-asyncio httpx slowapi PyJWT cachetools pytest-cov

      - name: Run tests
        run: pytest tests/ -q --tb=short --cov=basketball_ai --cov-report=term-missing

  # ─── lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linters
        run: pip install ruff flake8

      - name: Run ruff
        run: ruff check basketball_ai/ --select E,F,W --ignore E501,W503

      - name: Run flake8
        run: flake8 basketball_ai/ --max-line-length=120 --extend-ignore=E501,W503

  # ─── build-docker ────────────────────────────────────────────────────────
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test, lint]
    # Only build on pushes to main/master, not on every branch
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: basketball-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
