name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

# Minimal permissions for all jobs by default
permissions:
  contents: read

jobs:
  # ─── test ────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-asyncio httpx slowapi PyJWT cachetools pytest-cov

      - name: Run tests
        run: pytest tests/ -q --tb=short --cov=basketball_ai --cov-report=term-missing

  # ─── lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linters
        run: pip install ruff flake8

      - name: Run ruff
        run: ruff check basketball_ai/ --select E,F,W --ignore E501

      - name: Run flake8
        run: flake8 basketball_ai/ --max-line-length=120 --extend-ignore=E501,W503,E221,E231,E241,E272,E302,E303,E305,E225,E203,E127,W391,E261

  # ─── security ────────────────────────────────────────────────────────────
  security:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Install project deps
        run: pip install -e . --quiet
      - name: Run pip-audit
        run: pip-audit --desc on --skip-editable || true
        # || true: report vulnerabilities but don't fail build until baseline is set

  # ─── build-docker ────────────────────────────────────────────────────────
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: basketball-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: T6 – Smoke-test Docker container (/health)
        run: |
          docker run -d --name ba-smoke -p 8000:8000 \
            -e API_ENV=development basketball-ai:latest
          # Wait up to 30 s for the service to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health/live; then
              echo "Container is healthy"; break
            fi
            echo "Waiting ($i/15)…"; sleep 2
          done
          curl -sf http://localhost:8000/health/live || (docker logs ba-smoke && exit 1)
          docker stop ba-smoke
