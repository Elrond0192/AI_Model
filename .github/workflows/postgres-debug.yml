name: PostgreSQL Debug

on:
  push:
    branches: ["codex/ml-production-hardening"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  debug-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_model_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_model_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Diagnose adapter rebuild
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          PSQL="psql -h 127.0.0.1 -U postgres -d ai_model_test -v ON_ERROR_STOP=1"
          $PSQL -f tests/fixtures/postgres_competition_fixture.sql
          echo '=== FIRST INSTALL ==='
          $PSQL -f basketball_ai/data/ai_source_schema.sql
          $PSQL -f basketball_ai/data/ai_source_competition.sql
          $PSQL <<'SQL'
          SELECT 'player_registry' AS src, league_key, season, count(*) FROM ai_source._competition_player_registry GROUP BY 1,2,3 ORDER BY 2,3;
          SELECT 'stats_raw' AS src, league_key, season, competition, count(*) FROM ai_source._competition_stats_raw GROUP BY 1,2,3,4 ORDER BY 2,3,4;
          SELECT 'player_comp' AS src, league_key, season, competition, count(*) FROM ai_source.player_competition_stats GROUP BY 1,2,3,4 ORDER BY 2,3,4;
          SELECT 'team_comp' AS src, league_key, season, competition, count(*) FROM ai_source.team_competition_stats GROUP BY 1,2,3,4 ORDER BY 2,3,4;
          SQL
          echo '=== SECOND INSTALL ==='
          $PSQL -f basketball_ai/data/ai_source_schema.sql
          $PSQL -f basketball_ai/data/ai_source_competition.sql
          $PSQL <<'SQL'
          SELECT 'player_registry' AS src, league_key, season, count(*) FROM ai_source._competition_player_registry GROUP BY 1,2,3 ORDER BY 2,3;
          SELECT 'stats_raw' AS src, league_key, season, competition, count(*) FROM ai_source._competition_stats_raw GROUP BY 1,2,3,4 ORDER BY 2,3,4;
          SELECT 'player_comp' AS src, league_key, season, competition, count(*) FROM ai_source.player_competition_stats GROUP BY 1,2,3,4 ORDER BY 2,3,4;
          SELECT 'team_comp' AS src, league_key, season, competition, count(*) FROM ai_source.team_competition_stats GROUP BY 1,2,3,4 ORDER BY 2,3,4;
          SQL
