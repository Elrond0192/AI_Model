name: Apply Contact Mockup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mockup
        run: python scripts/apply_contact_mockup.py
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-contact-mockup.yml scripts/apply_contact_mockup.py
          git add basketball_ai/admin_web/static/index.html
          git commit -m 'feat(admin-web): add contact page mockup'
          git push
