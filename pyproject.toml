[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-ai"
version = "2.0.0"
description = "PostgreSQL-backed basketball forecasting and scenario inference service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "httpx>=0.25.0",
    "shap>=0.43.0",
    "scipy>=1.11.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "python-dotenv>=1.0.0",
    "streamlit>=1.37.0",
    "dash>=2.17.0",
    "gunicorn>=22.0.0",
    "argon2-cffi>=21.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

# P4 – Dependency lock file (auto-generated; do not edit by hand)

[project.scripts]
basketball-ai = "basketball_ai.__main__:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["basketball_ai*"]

[tool.pytest.ini_options]
markers = [
    "smoke: smoke tests (playwright-based UI tests, skipped unless playwright is installed)",
]
