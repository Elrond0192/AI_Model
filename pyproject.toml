[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-ai"
version = "2.0.0"
description = "Basketball Player Performance AI – prediction, scenarios, and chat API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "httpx>=0.25.0",
    "shap>=0.43.0",
    "scipy>=1.11.0",
    "sqlalchemy>=2.0.0",
    "pyodbc>=5.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "extra-streamlit-components>=0.1.60",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
basketball-ai = "basketball_ai.__main__:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["basketball_ai*"]
