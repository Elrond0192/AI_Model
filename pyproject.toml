[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-ai"
version = "2.0.0"
description = "PostgreSQL-backed BBallstat forecasting and scenario inference service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    "slowapi>=0.1.9",
    "PyJWT>=2.8.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "shap>=0.43.0",
    "scipy>=1.11.0",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0.0",
    "streamlit>=1.37.0",
    "argon2-cffi>=21.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0",
    "httpx>=0.25.0",
]

[project.scripts]
basketball-ai = "basketball_ai.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["basketball_ai*"]

[tool.pytest.ini_options]
markers = [
    "smoke: optional browser/UI smoke tests",
]
