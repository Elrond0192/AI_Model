# U2 – Minimal design system token file.
# Colours, typography and spacing are centralised here so the entire GUI
# inherits a consistent look without touching Python source files.
# Reference: https://docs.streamlit.io/develop/api-reference/configuration/config.toml

[theme]
# Primary brand colour (buttons, active widgets)
primaryColor        = "#1565C0"
# App background
backgroundColor     = "#FFFFFF"
# Sidebar / secondary background
secondaryBackgroundColor = "#F0F4F8"
# Default text colour
textColor           = "#1A1A2E"
# Monospace font used in code blocks and data tables
font                = "sans serif"
