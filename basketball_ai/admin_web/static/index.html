<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><meta name="theme-color" content="#07131f">
  <title>AI Model Control Center</title>
  <link rel="stylesheet" href="/assets/app.css?v=2.6.0">
  <link rel="stylesheet" href="/assets/assets/phosphor/regular/style.css">
  <link rel="stylesheet" href="/assets/assets/phosphor/fill/style.css">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="login-screen" class="login-screen">
    <div class="login-glow login-glow-a"></div>
    <div class="login-glow login-glow-b"></div>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand-mark large"><i class="ph-fill ph-diamond brand-diamond"></i></div>
      <div class="login-brand">AI Model</div>
      <div class="login-kicker">CONTROL CENTER</div>
      <h1>Operations Console</h1>
      <p>Accesso riservato agli operatori del modello.</p>
      <label>Utente<input id="login-username" name="username" type="text" autocomplete="username" required></label>
      <label>Password<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-wide" type="submit"><span>Accedi</span><i class="ph ph-arrow-right"></i></button>
      <div id="login-error" class="form-error"></div>
    </form>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark"><i class="ph-fill ph-diamond brand-diamond"></i></div>
        <div><div class="brand-title">AI Model</div><div class="brand-subtitle">Control Center</div></div>
      </div>

      <nav class="nav-list" aria-label="Navigazione principale">
        <div class="nav-group"><div class="nav-group-label">HOME</div>
          <button class="nav-item active" data-page="overview"><span class="nav-icon"><i class="ph ph-house"></i></span><span>Panoramica</span></button>
        </div>
        <div class="nav-group"><div class="nav-group-label">MODELS</div>
          <button class="nav-item" data-page="bb-rating"><span class="nav-icon"><i class="ph-fill ph-star"></i></span><span>BB-Rating</span></button>
          <button class="nav-item" data-page="future-performance"><span class="nav-icon"><i class="ph ph-crystal-ball"></i></span><span>Future Performance</span></button>
        </div>
        <div class="nav-group"><div class="nav-group-label">VALIDATION</div>
          <button class="nav-item" data-page="model-releases"><span class="nav-icon"><i class="ph ph-git-branch"></i></span><span>Release modelli</span></button>
        </div>
        <div class="nav-group"><div class="nav-group-label">LAB</div>
          <button class="nav-item" data-page="scenarios"><span class="nav-icon"><i class="ph ph-flask"></i></span><span>Scenario Lab</span></button>
        </div>
        <div class="nav-group"><div class="nav-group-label">OPERATIONS</div>
          <button class="nav-item" data-page="data"><span class="nav-icon"><i class="ph ph-database"></i></span><span>Dati e snapshot</span></button>
          <button class="nav-item" data-page="health"><span class="nav-icon"><i class="ph ph-heartbeat"></i></span><span>API e salute</span></button>
          <button class="nav-item" data-page="diagnostics"><span class="nav-icon"><i class="ph ph-stethoscope"></i></span><span>Diagnostica API</span></button>
        </div>
        <div class="nav-group"><div class="nav-group-label">ADMIN</div>
          <button class="nav-item admin-only" data-page="audit"><span class="nav-icon"><i class="ph ph-clipboard-text"></i></span><span>Registro audit</span></button>
          <button class="nav-item" data-page="settings"><span class="nav-icon"><i class="ph ph-gear"></i></span><span>Impostazioni</span></button>
        </div>
      </nav>

      <div class="sidebar-spacer"></div>
      <div class="user-card">
        <div id="user-avatar" class="avatar">A</div>
        <div class="user-copy"><strong id="user-name">admin</strong><span id="user-role">Administrator</span></div>
        <span class="chevron"><i class="ph ph-caret-right"></i></span>
      </div>
      <button id="logout-btn" class="btn btn-ghost btn-wide"><i class="ph ph-sign-out"></i><span>Esci</span></button>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="system-state"><span class="system-dot" id="system-dot"></span><span id="system-label">SYSTEM OPERATIONAL</span></div>
        <div class="topbar-spacer"></div>
        <div class="top-meta"><span>API</span><strong id="top-api" class="meta-ok">● V2</strong></div>
        <div class="top-meta"><span>DATABASE</span><strong id="top-db">not selected</strong></div>
        <div class="top-meta"><span>MODEL</span><strong id="top-model">not promoted</strong></div>
        <div class="top-meta"><span>BB-RATING</span><strong id="top-bb-rating">—</strong></div>
        <div class="top-meta utc"><span>UTC</span><strong id="top-utc">—</strong></div>
      </header>

      <div id="page-root" class="page-root"></div>
      <footer>© AI Model Control Center v2.5.0</footer>
    </main>
  </div>

  <template id="page-overview">
  <section class="page overview-page dashboard-v2" data-title="Panoramica">
    <div class="dashboard-page-head">
      <div>
        <div class="eyebrow">AI_MODEL / CONTROL CENTER</div>
        <h1>Centro operativo</h1>
        <p>Stato dei modelli, avanzamento dei job e salute del serving.</p>
      </div>
      <div class="dashboard-head-actions">
        <div class="dashboard-updated"><span class="dashboard-live-dot"></span><span>Stato operativo e disponibilità dei modelli</span></div>
        <button id="overview-refresh" class="btn btn-secondary btn-small"><i class="ph ph-arrows-clockwise"></i><span>Aggiorna</span></button>
      </div>
    </div>

    <div class="dashboard-system-strip">
      <div class="dashboard-system-left">
        <span class="dashboard-system-icon"><i class="ph ph-check-circle" id="overview-system-icon"></i></span>
        <div>
          <strong id="overview-system-status">Verifica del sistema</strong>
          <p id="overview-system-detail">Controllo API, dati e modelli in corso.</p>
        </div>
      </div>
      <div class="dashboard-system-meta">
        <span>AMBIENTE</span><strong id="overview-system-meta">Production</strong>
      </div>
    </div>

    <div id="overview-kpis" class="kpi-grid four overview-kpis dashboard-kpis"></div>

    <div class="dashboard-content-grid">
      <div class="dashboard-main-column">
        <section class="panel dashboard-job-panel">
          <div class="panel-heading">
            <div><div class="eyebrow">JOB MONITOR</div><h2>Attività modello</h2></div>
            <span id="overview-job-state" class="dashboard-state-pill">NESSUN JOB</span>
          </div>
          <div id="overview-job-panel" class="dashboard-job-body">
            <div class="dashboard-empty"><i class="ph ph-check-circle"></i><strong>Nessun job in esecuzione</strong><span>Qui vedrai la fase e la percentuale reale dei training.</span></div>
          </div>
        </section>

        <section class="panel dashboard-model-table-panel">
          <div class="panel-heading">
            <div><div class="eyebrow">MODEL REGISTRY</div><h2>Stato modelli</h2><p class="dashboard-panel-subtitle">Release, disponibilità e validazione</p></div>
            <button class="btn btn-secondary btn-small jump" data-page="model-releases">Tutte le release <i class="ph ph-arrow-up-right"></i></button>
          </div>
          <div class="table-shell dashboard-table-shell">
            <table>
              <thead><tr><th>Modello</th><th>Stato</th><th>Release</th><th>Validazione</th><th class="right">Azione</th></tr></thead>
              <tbody id="overview-model-table"></tbody>
            </table>
          </div>
        </section>

        <div class="dashboard-bottom-cards">
          <section class="panel">
            <div class="panel-heading"><div><div class="eyebrow">BB PREDICTION</div><h2>Previsione BB-Rating</h2></div><button class="icon-button jump" data-page="model-releases" aria-label="Apri BB Prediction Model"><i class="ph ph-arrow-up-right"></i></button></div>
            <div id="overview-registry" class="dashboard-summary"></div>
          </section>
          <section class="panel">
            <div class="panel-heading"><div><div class="eyebrow">FUTURE PERFORMANCE</div><h2>Forecast statistico</h2></div><button class="icon-button jump" data-page="future-performance" aria-label="Apri Future Performance"><i class="ph ph-arrow-up-right"></i></button></div>
            <div id="overview-backtest" class="dashboard-summary"></div>
          </section>
        </div>
      </div>

      <aside class="dashboard-side-column">
        <section class="panel dashboard-health-panel">
          <div class="panel-heading"><div><div class="eyebrow">SYSTEM HEALTH</div><h2>Salute del sistema</h2><p class="dashboard-panel-subtitle">Servizi e sorgenti essenziali</p></div><button class="icon-button jump" data-page="health" aria-label="Apri diagnostica salute"><i class="ph ph-arrow-up-right"></i></button></div>
          <div id="readiness-body" class="dashboard-health-list"></div>
        </section>

        <section class="panel dashboard-quality-panel">
          <div class="panel-heading"><div><div class="eyebrow">QUALITY GATES</div><h2>Qualità del modello</h2></div></div>
          <div id="candidate-quality" class="quality-grid dashboard-quality-grid">
            <div class="quality-card"><span>Validazione</span><strong>Walk-forward</strong></div>
            <div class="quality-card"><span>Promozione</span><strong>Baseline superato</strong></div>
            <div class="quality-card"><span>Scala target</span><strong>BB-Rating 1–100</strong></div>
          </div>
        </section>

        <section class="panel dashboard-shortcuts-panel">
          <div class="panel-heading"><div><div class="eyebrow">QUICK ACCESS</div><h2>Accesso rapido</h2></div></div>
          <div class="dashboard-shortcuts">
            <button class="dashboard-shortcut jump" data-page="data"><i class="ph ph-database"></i><span><strong>Dataset e snapshot</strong><small>Profili e dati di training</small></span><i class="ph ph-arrow-up-right shortcut-arrow"></i></button>
            <button class="dashboard-shortcut jump" data-page="scenarios"><i class="ph ph-flask"></i><span><strong>Scenario Lab</strong><small>Analisi what-if</small></span><i class="ph ph-arrow-up-right shortcut-arrow"></i></button>
            <button class="dashboard-shortcut jump admin-only" data-page="audit"><i class="ph ph-clipboard-text"></i><span><strong>Registro audit</strong><small>Eventi e operazioni</small></span><i class="ph ph-arrow-up-right shortcut-arrow"></i></button>
          </div>
        </section>
      </aside>
    </div>

    <footer class="dashboard-footer"><span>AI_Model <strong>Control Center</strong></span><span>Stati e percentuali provengono dalle API operative.</span></footer>
  </section>
</template>

  <template id="page-data">
    <section class="page">
      <div class="page-heading"><div><h1>Dati e snapshot</h1><p>Configura PostgreSQL e prepara lo storico immutabile per BB Prediction Model e Future Performance.</p></div></div>
      <section class="panel lifecycle-panel">
        <div class="panel-heading"><h2>Come funziona</h2><span class="registry-badge">Nessun terminale per l’operatività ordinaria</span></div>
        <div class="quality-grid lifecycle-grid">
          <div class="quality-card"><span>1 · Database</span><strong>Testa il profilo</strong><small>Verifica connessione e contratto AI.</small></div>
          <div class="quality-card"><span>2 · Storico modello</span><strong>Caricato automaticamente dal DB</strong><small>All’apertura del BO carica il profilo PostgreSQL e prepara lo snapshot core, senza PBP/lineup.</small></div>
          <div class="quality-card"><span>3 · BB Prediction</span><strong>Allena e valida il candidate</strong><small>Usa Model Releases; la produzione resta invariata fino alla promozione.</small></div>
          <div class="quality-card"><span>4 · Scenari avanzati</span><strong>On demand</strong><small>PBP e lineup sono separati dal training.</small></div>
        </div>
        <p class="microcopy">La migrazione iniziale degli schemi PostgreSQL resta un’operazione tecnica una tantum. Dopo l’installazione, usa questa pagina per il normale ciclo dati.</p>
      </section>
      <div class="split-grid data-grid">
        <section class="panel"><div class="panel-heading"><h2>Profili PostgreSQL</h2><button id="refresh-profiles" class="btn btn-small btn-secondary">Aggiorna</button></div><div id="profiles-list" class="profile-list"></div></section>
        <section class="panel"><div class="panel-heading"><h2>Configurazione database</h2></div>
          <form id="profile-form" class="form-grid">
            <label class="span-2">Profile name<input name="name" placeholder="production" required></label>
            <label class="span-2">Host<input name="host" value="host.docker.internal" required></label>
            <label>Port<input name="port" type="number" value="5432" min="1" max="65535" required></label>
            <label>Database<input name="database" required></label>
            <label>PostgreSQL user<input name="user" required></label>
            <label>Password<input name="password" type="password" placeholder="Lascia vuoto per mantenere quella esistente"></label>
            <label>Source schema<input name="source_schema" value="AI_Source" required></label>
            <label>Output schema<input name="ai_schema" value="AI" required></label>
            <button class="btn btn-primary span-2" type="submit">Salva profilo</button>
          </form>
        </section>
      </div>
      <section class="panel"><div class="panel-heading"><h2>Storico pronto per il modello</h2><button id="refresh-snapshots" class="btn btn-small btn-secondary">Aggiorna</button></div><p class="microcopy">Uno snapshot è una copia immutabile dei dati core storici. Prepararlo non allena il modello e non legge play-by-play.</p><div id="snapshots-list" class="profile-list"></div></section>
      <section class="panel"><div class="panel-heading"><h2>Stato delle stagioni</h2><button id="refresh-lifecycle" class="btn btn-small btn-secondary">Aggiorna</button></div><p class="microcopy">Segna una stagione <strong>Completa</strong> solo quando AdvancedStats e risultati finali sono definitivi. Il training esclude automaticamente le stagioni <strong>In corso</strong>; resta bloccato solo in presenza di stagioni non classificate o <strong>Bloccate</strong>.</p><div id="season-lifecycle-list" class="profile-list"></div></section>
      <section class="panel contract-panel"><div class="panel-heading"><h2>Contratto dati canonical</h2></div><div class="contract-tags"><span>"AI_Source"."Leagues"</span><span>"AI_Source"."Teams"</span><span>"AI_Source"."Players"</span><span>player_competition_stats</span><span>team_competition_stats</span><span>immutable training snapshot</span><span>scenario_* serving</span></div></section>
    </section>
  </template>

  <template id="page-future-performance">
    <section class="page">
      <div class="page-heading action-heading">
        <div>
          <h1 class="page-title-with-icon"><span class="page-title-icon" aria-hidden="true"><i class="ph ph-crystal-ball"></i></span><span>Player Future Performance</span></h1>
          <p>Modello predittivo multivariato season-ahead. Prevede le statistiche del giocatore nella stagione successiva; è distinto dal BB Prediction Model che prevede il BB-Rating 1–100.</p>
        </div>
        <div class="button-row">
          <button id="future-performance-refresh" class="btn btn-secondary btn-small">Aggiorna</button>
          <button id="future-performance-train" class="btn btn-primary btn-small">Genera / aggiorna modello</button>
        </div>
      </div>
      <div id="future-performance-kpis" class="kpi-grid four"></div>
      <div class="split-grid">
        <section class="panel"><div class="panel-heading"><h2>Stato modello</h2></div><div id="future-performance-status"></div></section>
        <section class="panel"><div class="panel-heading"><h2>Dataset &amp; finestra temporale</h2></div><div id="future-performance-dataset"></div></section>
      </div>
      <section class="panel"><div class="panel-heading"><h2>Target predetti</h2><span class="muted-inline">valori t+1 + incertezza OOS</span></div><div id="future-performance-targets" class="table-shell"></div></section>
      <section class="panel"><div class="panel-heading"><h2>Walk-forward validation</h2><span class="muted-inline">expanding OOS</span></div><div id="future-performance-backtest" class="table-shell"></div></section>
      <section class="panel"><div class="panel-heading"><h2>Training job</h2></div><div id="future-performance-job"></div></section>
      <div id="future-performance-error" class="microcopy"></div>
    </section>
  </template>

  <template id="page-bb-rating">
    <section class="page">
      <div class="page-heading action-heading">
        <div><h1>BB-Rating</h1><p>Layer descrittivo del rendimento: rating 1–100, calibrazione empirica e uncertainty serving. Include il BB Prediction Model come previsione futura distinta dal rating descrittivo.</p></div>
        <div class="button-row"><button id="bb-rating-refresh" class="btn btn-secondary" type="button">Aggiorna</button><button id="bb-rating-calibrate" class="btn btn-primary" type="button">Ricalibra BB-Rating</button></div>
      </div>
      <div id="bb-rating-kpis" class="kpi-grid four"></div>
      <section id="bb-rating-job" class="panel job-panel"></section>
      <div class="split-grid">
        <section class="panel">
          <div class="panel-heading"><h2>Serving status</h2></div>
          <div id="bb-rating-status"></div>
          <div id="bb-rating-runtime" class="summary-list"></div>
        </section>
        <section class="panel">
          <div class="panel-heading"><h2>Dataset calibration</h2></div>
          <div id="bb-rating-dataset" class="summary-list"></div>
        </section>
      </div>
      <div class="split-grid">
        <section class="panel">
          <div class="panel-heading"><h2>Uncertainty layer</h2></div>
          <div id="bb-rating-uncertainty" class="summary-list"></div>
          <p class="microcopy">L'incertezza descrive la variabilità storica tra stagioni consecutive. Non corregge il BB-Rating corrente e non modifica il BB Prediction Model.</p>
        </section>
        <section class="panel">
          <div class="panel-heading"><h2>Artifacts</h2></div>
          <div id="bb-rating-files" class="summary-list"></div>
          <p class="microcopy">Il report è diagnostico; <code>bb_rating_uncertainty.json</code> è l'artifact usato dal serving.</p>
        </section>
      </div>
      <section class="panel">
        <div class="panel-heading"><h2>Runtime warnings</h2></div>
        <div id="bb-rating-warnings" class="health-list"></div>
      </section>
    </section>
  </template>

  <template id="page-model-releases">
    <section class="page">
      <div class="page-heading"><div><h1>Model Releases</h1><p>Candidate validation, promotion and rollback for BB Prediction Model, BB-Rating and Future Performance. Promoting an artifact requires an inference API restart.</p></div><button id="model-releases-refresh" class="btn btn-secondary">Aggiorna</button></div>
      <section class="panel"><div class="panel-heading"><h2>Serving runtime</h2><button class="btn btn-secondary btn-small jump" data-page="health">Apri health checks</button></div><div id="model-release-serving"></div></section>
      <section class="panel"><div class="panel-heading"><div><h2>BB Prediction Model (1–100)</h2><p class="microcopy">Previsione diretta del BB-Rating ufficiale futuro. Il target viene ricalcolato dal BB-Rating engine nel contesto di destinazione; non è una conversione del rating statistico 0–10.</p></div><button id="bb-rating-prediction-start" class="btn btn-primary">Allena candidate</button></div><div id="bb-rating-prediction-job"></div><div id="bb-rating-prediction-release"></div><div class="button-row"><button class="btn btn-primary release-promote" data-model="bb-rating-prediction">Promuovi candidate</button><button class="btn btn-danger release-rollback" data-model="bb-rating-prediction">Rollback</button></div></section>
      <div class="split-grid">
        <section class="panel"><div class="panel-heading"><h2>BB-Rating</h2></div><div id="release-bb-rating"></div><div class="button-row"><button class="btn btn-primary release-promote" data-model="bb-rating">Promuovi candidate</button><button class="btn btn-danger release-rollback" data-model="bb-rating">Rollback</button></div></section>
        <section class="panel"><div class="panel-heading"><h2>Future Performance</h2></div><div id="release-future-performance"></div><div class="button-row"><button class="btn btn-primary release-promote" data-model="future-performance">Promuovi candidate</button><button class="btn btn-danger release-rollback" data-model="future-performance">Rollback</button></div></section>
      </div>
      <section class="panel"><div class="panel-heading"><h2>Release operation result</h2></div><div id="model-release-result" class="microcopy">Nessuna operazione eseguita.</div></section>
    </section>
  </template>

  <template id="page-scenarios">
    <section class="page">
      <div class="page-heading"><div><h1>Scenario Lab</h1><p>Valuta scenari con il motore production: ensemble XGBoost e, quando disponibili, feed play-by-play.</p></div></div>
      <div class="split-grid scenario-grid">
        <section class="panel"><div class="panel-heading"><h2>Scenario request</h2></div>
          <form id="scenario-form" class="form-grid">
            <label class="span-2">Scenario<select name="scenario"><option value="player_team">Player in team</option><option value="style_change">Style change</option><option value="player_role_change">Player role change</option><option value="league_transfer">League transfer</option><option value="probabilistic_boxscore">Probabilistic boxscore</option><option value="opponent_matchup">Opponent matchup</option><option value="defensive_matchup">Defensive matchup</option><option value="play_type_matchup">Play type matchup</option><option value="shot_profile_counterfactual">Shot profile counterfactual</option><option value="lineup_synergy">Lineup synergy</option><option value="lineup_optimizer">Lineup optimizer</option><option value="roster_optimizer">Roster optimizer</option><option value="causal_effect">Causal effect</option></select></label>
            <div class="span-2 entity-picker" data-entity="player">
              <label>Giocatori</label>
              <div class="entity-picker-control">
                <div class="entity-chips" data-chips></div>
                <input data-search type="search" autocomplete="off" placeholder="Cerca giocatore per nome…">
              </div>
              <div class="entity-picker-menu hidden" data-results></div>
              <small class="entity-picker-hint">Seleziona uno o più giocatori. L'identità globale viene risolta automaticamente dal sistema.</small>
            </div>
            <div class="span-2 entity-picker" data-entity="team">
              <label>Squadre</label>
              <div class="entity-picker-control">
                <div class="entity-chips" data-chips></div>
                <input data-search type="search" autocomplete="off" placeholder="Cerca squadra per nome…">
              </div>
              <div class="entity-picker-menu hidden" data-results></div>
              <small class="entity-picker-hint">Seleziona una o più squadre. L'identità globale viene risolta automaticamente dal sistema.</small>
            </div>
            <label>Source league<input name="source_league" placeholder="ITA1"></label><label>Target league<input name="target_league" placeholder="ITA1"></label>
            <label>Season<input name="season" type="number" min="2000" max="2100" required></label><label>Competition<input name="competition" value="RS" required></label>
            <label>Top N<input name="top_n" type="number" min="1" max="20" value="5"></label><label>Simulations<input name="simulations" type="number" min="500" max="50000" value="5000"></label>
            <label class="span-2">Parameters JSON <textarea name="parameters" rows="4" placeholder='{"seed": 42}'></textarea></label>
            <button id="scenario-submit" class="btn btn-primary span-2" type="submit">Valuta scenario</button>
          </form>
        </section>
        <section class="panel"><div class="panel-heading"><h2>Result</h2></div><pre id="scenario-result" class="scenario-result">Compila il contesto e avvia una valutazione.</pre></section>
      </div>
      <p class="microcopy">Gli scenari avanzati usano automaticamente le evidenze possesso/lineup caricate dall’API; se non disponibili, la risposta dichiara il fallback e le limitazioni.</p>
    </section>
  </template>


  <template id="page-diagnostics">
    <div class="page-heading action-heading">
      <div><h1>API Diagnostics</h1><p>Test controllati delle API production con validazione della risposta. Nessun endpoint arbitrario e nessuna modifica ai modelli.</p></div>
      <button id="diagnostics-health" class="btn btn-secondary">Health Check</button>
    </div>
    <section class="panel diagnostics-form-panel">
      <div class="panel-heading"><h2>Test Player</h2><span class="microcopy">Usa un giocatore reale dello storico attivo.</span></div>
      <div class="diagnostics-grid">
        <label>Giocatore
          <input id="diag-player-search" class="input" type="search" placeholder="Cerca nome…">
          <select id="diag-player" class="input"><option value="">Seleziona giocatore</option></select>
        </label>
        <label>Squadra
          <input id="diag-team-search" class="input" type="search" autocomplete="off" placeholder="Cerca squadra per nome…">
          <select id="diag-team" class="input"><option value="">Seleziona squadra</option></select>
          <small class="microcopy">Il Global ID viene risolto automaticamente.</small>
        </label>
        <label>League <input id="diag-league" class="input" value="ITA1"></label>
        <label>Season <input id="diag-season" class="input" type="number" value="2025" min="2000" max="2100"></label>
        <label>Competition <select id="diag-competition" class="input"><option>RS</option><option>PO</option><option>TOT</option></select></label>
        <label>Metriche Metric Rating <input id="diag-metrics" class="input" value="RAPTOR,LEBRON,VORP"></label>
      </div>
      <div class="button-row diagnostics-buttons">
        <button class="btn btn-secondary diag-run" data-model="bb_rating_prediction">BB Prediction 1–100</button>
        <button class="btn btn-secondary diag-run" data-model="bb_rating">BB-Rating</button>
        <button class="btn btn-secondary diag-run" data-model="future_performance">Future Performance</button>
        <button class="btn btn-secondary diag-run" data-model="metric_rating">Metric Rating</button>
        <button class="btn btn-primary" id="diagnostics-all">Esegui tutti</button>
      </div>
    </section>
    <section class="panel"><div class="panel-heading"><h2>Risultati</h2><span id="diagnostics-summary" class="microcopy">Nessun test eseguito</span></div><div id="diagnostics-results" class="diagnostics-results"><div class="empty-state compact"><strong>Pronto per il test</strong><p>Seleziona un giocatore e avvia una diagnostica.</p></div></div></section>
  </template>

  <template id="page-health">
    <section class="page">
      <div class="page-heading action-heading"><div><h1>API &amp; Health</h1><p>Stato dell'inference service e modello production attivo</p></div><button id="refresh-health" class="btn btn-secondary">Aggiorna</button></div>
      <div id="health-kpis" class="kpi-grid five"></div>
      <div class="split-grid"><section class="panel"><div class="panel-heading"><h2>Runtime checks</h2></div><div id="health-checks" class="health-list"></div></section><section class="panel"><div class="panel-heading"><h2>Served endpoints</h2></div><div id="health-endpoints" class="endpoint-list"></div></section></div>
    </section>
  </template>

  <template id="page-audit">
    <section class="page">
      <div class="page-heading action-heading"><div><h1>Audit Logs</h1><p>Eventi di autenticazione e operazioni amministrative</p></div><button id="refresh-audit" class="btn btn-secondary">Aggiorna</button></div>
      <section class="panel"><div class="table-shell"><table><thead><tr><th>UTC</th><th>Action</th><th>Actor</th><th>Target</th><th>Details</th></tr></thead><tbody id="audit-body"></tbody></table></div></section>
    </section>
  </template>

  <template id="page-contact">
    <section class="page">
      <div class="page-heading"><div><h1>Contatti</h1><p>Hai una domanda, vuoi segnalare un problema o proporre un miglioramento? Invia un messaggio direttamente al team.</p></div></div>
      <div class="split-grid">
        <section class="panel">
          <div class="panel-heading"><div><h2>Invia un messaggio</h2><p class="microcopy">Compila il form e descrivi la tua richiesta nel modo più dettagliato possibile.</p></div></div>
          <form class="form-grid" id="contact-form">
            <label>Nome<input name="name" type="text" autocomplete="name" placeholder="Il tuo nome" required></label>
            <label>Email<input name="email" type="email" autocomplete="email" placeholder="nome@azienda.it" required></label>
            <label class="span-2">Oggetto<input name="subject" type="text" placeholder="Come possiamo aiutarti?" required></label>
            <label class="span-2">Messaggio<textarea name="message" rows="8" placeholder="Scrivi qui il tuo messaggio..." required></textarea></label>
            <div class="span-2 button-row" style="align-items:center;justify-content:space-between">
              <span class="microcopy"><strong>Privacy:</strong> i dati saranno usati esclusivamente per rispondere alla richiesta.</span>
              <button class="btn btn-primary" type="submit">Apri client email</button>
            </div>
            <p class="span-2 microcopy">Compilando e inviando, si apre il tuo client di posta con i campi già pronti verso il team operativo. Nessun dato viene inviato direttamente da questa pagina finché non è collegato un backend reale.</p>
          </form>
          <script>
            document.getElementById('contact-form').addEventListener('submit', function(e){
              e.preventDefault();
              const f = new FormData(this);
              const subject = encodeURIComponent(f.get('subject') || 'Richiesta da AI Model Control Center');
              const body = encodeURIComponent(`Da: ${f.get('name')} <${f.get('email')}>\n\n${f.get('message')}`);
              window.location.href = `mailto:support@bballstat.com?subject=${subject}&body=${body}`;
            });
          </script>
        </section>
        <aside class="panel">
          <div class="panel-heading"><h2>Prima di scriverci</h2></div>
          <div class="summary-list">
            <div class="summary-row"><span>Problemi tecnici</span><strong>Indica pagina ed errore</strong></div>
            <div class="summary-row"><span>Funzionalità</span><strong>Descrivi il risultato atteso</strong></div>
            <div class="summary-row"><span>Oggetto</span><strong>Usa un titolo chiaro</strong></div>
          </div>
        </aside>
      </div>
    </section>
  </template>

  <template id="page-settings">
    <section class="page">
      <div class="page-heading"><div><h1>Settings</h1><p>Runtime, promotion gates e sicurezza dell'account</p></div></div>
      <div class="split-grid"><section class="panel"><div class="panel-heading"><h2>Runtime</h2></div><div id="runtime-settings" class="settings-list"></div></section><section class="panel"><div class="panel-heading"><h2>Promotion gates</h2></div><div id="promotion-settings" class="settings-list"></div></section></div>
      <section class="panel password-panel"><div class="panel-heading"><h2>Cambia password</h2></div><form id="password-form" class="password-form"><label>Password attuale<input name="old_password" type="password" required></label><label>Nuova password<input name="new_password" type="password" required></label><button class="btn btn-primary" type="submit">Aggiorna password</button></form><p class="microcopy">Dopo il cambio password tutte le sessioni attive vengono revocate.</p></section>
    </section>
  </template>

  <script src="/assets/app.js?v=2.6.0" defer></script>
</body>
</html>
