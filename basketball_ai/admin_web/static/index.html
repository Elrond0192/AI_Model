<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><meta name="theme-color" content="#07131f">
  <title>AI Model Control Center</title>
  <link rel="stylesheet" href="/assets/app.css?v=2.5.0">
  <link rel="stylesheet" href="/assets/phosphor/regular/style.css">
  <link rel="stylesheet" href="/assets/phosphor/fill/style.css">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="login-screen" class="login-screen">
    <div class="login-glow login-glow-a"></div>
    <div class="login-glow login-glow-b"></div>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand-mark large"><i class="ph-fill ph-diamond brand-diamond"></i></div>
      <div class="login-brand">AI Model</div>
      <div class="login-kicker">CONTROL CENTER</div>
      <h1>Operations Console</h1>
      <p>Accesso riservato agli operatori del modello.</p>
      <label>Utente<input id="login-username" name="username" type="text" autocomplete="username" required></label>
      <label>Password<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-wide" type="submit"><span>Accedi</span><i class="ph ph-arrow-right"></i></button>
      <div id="login-error" class="form-error"></div>
    </form>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark"><i class="ph-fill ph-diamond brand-diamond"></i></div>
        <div><div class="brand-title">AI Model</div><div class="brand-subtitle">Control Center</div></div>
      </div>

      <nav class="nav-list" aria-label="Navigazione principale">
        <button class="nav-item active" data-page="overview"><span class="nav-icon"><i class="ph ph-house"></i></span><span>Overview</span></button>
        <button class="nav-item" data-page="data"><span class="nav-icon"><i class="ph ph-database"></i></span><span>Dati e snapshot</span></button>
        <button class="nav-item" data-page="training"><span class="nav-icon"><i class="ph ph-trend-up"></i></span><span>Training</span></button>
        <button class="nav-item" data-page="backtests"><span class="nav-icon"><i class="ph ph-chart-line-up"></i></span><span>Backtests</span></button>
        <button class="nav-item" data-page="bb-rating"><span class="nav-icon"><i class="ph-fill ph-star"></i></span><span>BB-Rating</span></button>
        <button class="nav-item" data-page="scenarios"><span class="nav-icon"><i class="ph ph-flask"></i></span><span>Scenario Lab</span></button>
        <button class="nav-item" data-page="registry"><span class="nav-icon"><i class="ph ph-cube"></i></span><span>Model Registry</span></button>
        <button class="nav-item" data-page="health"><span class="nav-icon"><i class="ph ph-heartbeat"></i></span><span>API &amp; Health</span></button>
        <button class="nav-item admin-only" data-page="audit"><span class="nav-icon"><i class="ph ph-clipboard-text"></i></span><span>Audit Logs</span></button>
        <button class="nav-item" data-page="contact"><span class="nav-icon"><i class="ph ph-envelope"></i></span><span>Contatti</span></button>
        <button class="nav-item" data-page="settings"><span class="nav-icon"><i class="ph ph-gear"></i></span><span>Settings</span></button>
      </nav>

      <div class="sidebar-spacer"></div>
      <div class="user-card">
        <div id="user-avatar" class="avatar">A</div>
        <div class="user-copy"><strong id="user-name">admin</strong><span id="user-role">Administrator</span></div>
        <span class="chevron"><i class="ph ph-caret-right"></i></span>
      </div>
      <button id="logout-btn" class="btn btn-ghost btn-wide"><i class="ph ph-sign-out"></i><span>Esci</span></button>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-spacer"></div>
        <div class="top-meta"><span>ACTIVE API</span><strong id="top-api" class="meta-ok">● V2</strong></div>
        <div class="top-meta"><span>DATABASE</span><strong id="top-db">not selected</strong></div>
        <div class="top-meta"><span>ACTIVE MODEL</span><strong id="top-model">not promoted</strong></div>
        <div class="top-meta"><span>BB-RATING</span><strong id="top-bb-rating">—</strong></div>
        <div class="top-meta utc"><span>UTC</span><strong id="top-utc">—</strong></div>
      </header>

      <div id="page-root" class="page-root"></div>
      <footer>© AI Model Control Center v2.5.0</footer>
    </main>
  </div>

  <template id="page-overview">
    <section class="page" data-title="Overview">
      <div class="page-heading"><div><h1>Overview</h1><p>Panoramica dello stato del sistema AI Model</p></div></div>
      <div id="overview-kpis" class="kpi-grid six"></div>
      <section class="section-block">
        <div class="section-heading"><h2>Operational readiness</h2></div>
        <div class="table-shell"><table><thead><tr><th>Componente</th><th>Stato</th><th>Dettagli</th><th class="right">Azione</th></tr></thead><tbody id="readiness-body"></tbody></table></div>
      </section>
      <div class="split-grid">
        <section class="panel"><div class="panel-heading"><h2>Model registry</h2><button class="btn btn-small btn-secondary jump" data-page="registry">Vai al registry</button></div><div id="overview-registry"></div></section>
        <section class="panel"><div class="panel-heading"><h2>Ultimo backtest</h2><button class="btn btn-small btn-secondary jump" data-page="backtests">Vai ai backtest</button></div><div id="overview-backtest"></div></section>
      </div>
      <section class="panel candidate-panel"><div class="panel-heading"><h2>Candidate quality <span class="muted-inline">(ultimo run)</span></h2></div><div id="candidate-quality" class="quality-grid"></div></section>
    </section>
  </template>

  <template id="page-data">
    <section class="page">
      <div class="page-heading"><div><h1>Dati e snapshot</h1><p>Configura PostgreSQL, prepara lo storico immutabile e porta i dati al training senza passare dal terminale.</p></div></div>
      <section class="panel lifecycle-panel">
        <div class="panel-heading"><h2>Come funziona</h2><span class="registry-badge">Nessun terminale per l’operatività ordinaria</span></div>
        <div class="quality-grid lifecycle-grid">
          <div class="quality-card"><span>1 · Database</span><strong>Testa il profilo</strong><small>Verifica connessione e contratto AI.</small></div>
          <div class="quality-card"><span>2 · Storico modello</span><strong>Prepara storico modello</strong><small>Legge solo Anagrafiche e AdvancedStats: non carica PBP.</small></div>
          <div class="quality-card"><span>3 · Training</span><strong>Usa lo snapshot</strong><small>Genera un candidate; production resta invariato.</small></div>
          <div class="quality-card"><span>4 · Scenari avanzati</span><strong>On demand</strong><small>PBP e lineup sono separati dal training.</small></div>
        </div>
        <p class="microcopy">La migrazione iniziale degli schemi PostgreSQL resta un’operazione tecnica una tantum. Dopo l’installazione, usa questa pagina per il normale ciclo dati.</p>
      </section>
      <div class="split-grid data-grid">
        <section class="panel"><div class="panel-heading"><h2>Profili PostgreSQL</h2><button id="refresh-profiles" class="btn btn-small btn-secondary">Aggiorna</button></div><div id="profiles-list" class="profile-list"></div></section>
        <section class="panel"><div class="panel-heading"><h2>Configurazione database</h2></div>
          <form id="profile-form" class="form-grid">
            <label class="span-2">Profile name<input name="name" placeholder="production" required></label>
            <label class="span-2">Host<input name="host" value="host.docker.internal" required></label>
            <label>Port<input name="port" type="number" value="5432" min="1" max="65535" required></label>
            <label>Database<input name="database" required></label>
            <label>PostgreSQL user<input name="user" required></label>
            <label>Password<input name="password" type="password" placeholder="Lascia vuoto per mantenere quella esistente"></label>
            <label>Source schema<input name="source_schema" value="AI_Source" required></label>
            <label>Output schema<input name="ai_schema" value="AI" required></label>
            <button class="btn btn-primary span-2" type="submit">Salva profilo</button>
          </form>
        </section>
      </div>
      <section class="panel"><div class="panel-heading"><h2>Storico pronto per il modello</h2><button id="refresh-snapshots" class="btn btn-small btn-secondary">Aggiorna</button></div><p class="microcopy">Uno snapshot è una copia immutabile dei dati core storici. Prepararlo non allena il modello e non legge play-by-play.</p><div id="snapshots-list" class="profile-list"></div></section>
      <section class="panel"><div class="panel-heading"><h2>Stato delle stagioni</h2><button id="refresh-lifecycle" class="btn btn-small btn-secondary">Aggiorna</button></div><p class="microcopy">Segna una stagione <strong>Completa</strong> solo quando AdvancedStats e risultati finali sono definitivi. Il training esclude automaticamente le stagioni <strong>In corso</strong>; resta bloccato solo in presenza di stagioni non classificate o <strong>Bloccate</strong>.</p><div id="season-lifecycle-list" class="profile-list"></div></section>
      <section class="panel contract-panel"><div class="panel-heading"><h2>Contratto dati canonical</h2></div><div class="contract-tags"><span>"AI_Source"."Leagues"</span><span>"AI_Source"."Teams"</span><span>"AI_Source"."Players"</span><span>player_competition_stats</span><span>team_competition_stats</span><span>immutable training snapshot</span><span>scenario_* serving</span></div></section>
    </section>
  </template>

  <template id="page-training">
    <section class="page">
      <div class="page-heading action-heading"><div><h1>Training</h1><p>Usa esclusivamente uno snapshot già preparato: niente caricamenti automatici o letture PBP.</p></div><button id="start-training" class="btn btn-primary">Avvia training</button></div>
      <div id="training-kpis" class="kpi-grid four"></div>
      <section id="training-job" class="panel job-panel"></section>
      <section class="panel"><div class="panel-heading"><h2>Leakage-safe training contract</h2></div><div class="table-shell"><table><thead><tr><th>Stage</th><th>Seasons</th><th>Purpose</th></tr></thead><tbody id="training-contract"></tbody></table></div></section>
      <section class="panel"><div class="panel-heading"><h2>Immutable run configuration</h2></div><div id="training-config" class="config-grid"></div></section>
    </section>
  </template>

  <template id="page-backtests">
    <section class="page">
      <div class="page-heading"><div><h1>Backtests</h1><p>Walk-forward out-of-time dell'ensemble esatto di produzione</p></div></div>
      <div id="backtest-kpis" class="kpi-grid four"></div>
      <div class="split-grid"><section class="panel"><div class="panel-heading"><h2>RMSE by target season</h2></div><div id="backtest-chart" class="chart-box"></div></section><section class="panel"><div class="panel-heading"><h2>Candidate summary</h2></div><div id="backtest-summary"></div></section></div>
      <section class="panel"><div class="panel-heading"><h2>By competition</h2></div><div class="table-shell"><table><thead><tr><th>Competition</th><th>N</th><th>RMSE</th><th>MAE</th><th>Bias</th><th>Coverage</th></tr></thead><tbody id="competition-body"></tbody></table></div></section>
    </section>
  </template>

  <template id="page-registry">
    <section class="page">
      <div class="page-heading"><div><h1>Model Registry</h1><p>Candidate immutabili, promotion gates e rollback controllato</p></div></div>
      <div id="registry-cards" class="split-grid"></div>
      <section class="panel"><div class="panel-heading"><h2>Promotion controls</h2></div><div class="control-row"><label class="confirm"><input id="registry-confirm" type="checkbox"><span>Ho verificato il walk-forward report e i promotion gates</span></label><div class="button-row"><button id="promote-btn" class="btn btn-primary" disabled>Promuovi candidate</button><button id="rollback-btn" class="btn btn-danger" disabled>Rollback previous</button></div></div></section>
      <section class="panel"><div class="panel-heading"><h2>Registry history</h2></div><div class="table-shell"><table><thead><tr><th>UTC</th><th>Event</th><th>Run ID</th></tr></thead><tbody id="registry-history"></tbody></table></div></section>
    </section>
  </template>

  <template id="page-bb-rating">
    <section class="page">
      <div class="page-heading action-heading">
        <div><h1>BB-Rating</h1><p>Layer descrittivo del rendimento: rating 1–100, calibrazione empirica e uncertainty serving. Separato dal Prediction Model.</p></div>
        <div class="button-row"><button id="bb-rating-refresh" class="btn btn-secondary" type="button">Aggiorna</button><button id="bb-rating-calibrate" class="btn btn-primary" type="button">Ricalibra BB-Rating</button></div>
      </div>
      <div id="bb-rating-kpis" class="kpi-grid four"></div>
      <section id="bb-rating-job" class="panel job-panel"></section>
      <div class="split-grid">
        <section class="panel">
          <div class="panel-heading"><h2>Serving status</h2></div>
          <div id="bb-rating-status"></div>
          <div id="bb-rating-runtime" class="summary-list"></div>
        </section>
        <section class="panel">
          <div class="panel-heading"><h2>Dataset calibration</h2></div>
          <div id="bb-rating-dataset" class="summary-list"></div>
        </section>
      </div>
      <div class="split-grid">
        <section class="panel">
          <div class="panel-heading"><h2>Uncertainty layer</h2></div>
          <div id="bb-rating-uncertainty" class="summary-list"></div>
          <p class="microcopy">L'incertezza descrive la variabilità storica tra stagioni consecutive. Non corregge il BB-Rating corrente e non modifica il Prediction Model.</p>
        </section>
        <section class="panel">
          <div class="panel-heading"><h2>Artifacts</h2></div>
          <div id="bb-rating-files" class="summary-list"></div>
          <p class="microcopy">Il report è diagnostico; <code>bb_rating_uncertainty.json</code> è l'artifact usato dal serving.</p>
        </section>
      </div>
      <section class="panel">
        <div class="panel-heading"><h2>Runtime warnings</h2></div>
        <div id="bb-rating-warnings" class="health-list"></div>
      </section>
    </section>
  </template>

  <template id="page-scenarios">
    <section class="page">
      <div class="page-heading"><div><h1>Scenario Lab</h1><p>Valuta scenari con il motore production: ensemble XGBoost e, quando disponibili, feed play-by-play.</p></div></div>
      <div class="split-grid scenario-grid">
        <section class="panel"><div class="panel-heading"><h2>Scenario request</h2></div>
          <form id="scenario-form" class="form-grid">
            <label class="span-2">Scenario<select name="scenario"><option value="player_team">Player in team</option><option value="style_change">Style change</option><option value="player_role_change">Player role change</option><option value="league_transfer">League transfer</option><option value="probabilistic_boxscore">Probabilistic boxscore</option><option value="opponent_matchup">Opponent matchup</option><option value="defensive_matchup">Defensive matchup</option><option value="play_type_matchup">Play type matchup</option><option value="shot_profile_counterfactual">Shot profile counterfactual</option><option value="lineup_synergy">Lineup synergy</option><option value="lineup_optimizer">Lineup optimizer</option><option value="roster_optimizer">Roster optimizer</option><option value="causal_effect">Causal effect</option></select></label>
            <div class="span-2 entity-picker" data-entity="player">
              <label>Giocatori</label>
              <div class="entity-picker-control">
                <div class="entity-chips" data-chips></div>
                <input data-search type="search" autocomplete="off" placeholder="Cerca giocatore per nome…">
              </div>
              <div class="entity-picker-menu hidden" data-results></div>
              <small class="entity-picker-hint">Seleziona uno o più giocatori. L'identità globale viene risolta automaticamente dal sistema.</small>
            </div>
            <div class="span-2 entity-picker" data-entity="team">
              <label>Squadre</label>
              <div class="entity-picker-control">
                <div class="entity-chips" data-chips></div>
                <input data-search type="search" autocomplete="off" placeholder="Cerca squadra per nome…">
              </div>
              <div class="entity-picker-menu hidden" data-results></div>
              <small class="entity-picker-hint">Seleziona una o più squadre. L'identità globale viene risolta automaticamente dal sistema.</small>
            </div>
            <label>Source league<input name="source_league" placeholder="ITA1"></label><label>Target league<input name="target_league" placeholder="ITA1"></label>
            <label>Season<input name="season" type="number" min="2000" max="2100" required></label><label>Competition<input name="competition" value="RS" required></label>
            <label>Top N<input name="top_n" type="number" min="1" max="20" value="5"></label><label>Simulations<input name="simulations" type="number" min="500" max="50000" value="5000"></label>
            <label class="span-2">Parameters JSON <textarea name="parameters" rows="4" placeholder='{"seed": 42}'></textarea></label>
            <button id="scenario-submit" class="btn btn-primary span-2" type="submit">Valuta scenario</button>
          </form>
        </section>
        <section class="panel"><div class="panel-heading"><h2>Result</h2></div><pre id="scenario-result" class="scenario-result">Compila il contesto e avvia una valutazione.</pre></section>
      </div>
      <p class="microcopy">Gli scenari avanzati usano automaticamente le evidenze possesso/lineup caricate dall’API; se non disponibili, la risposta dichiara il fallback e le limitazioni.</p>
    </section>
  </template>

  <template id="page-health">
    <section class="page">
      <div class="page-heading action-heading"><div><h1>API &amp; Health</h1><p>Stato dell'inference service e modello production attivo</p></div><button id="refresh-health" class="btn btn-secondary">Aggiorna</button></div>
      <div id="health-kpis" class="kpi-grid five"></div>
      <div class="split-grid"><section class="panel"><div class="panel-heading"><h2>Runtime checks</h2></div><div id="health-checks" class="health-list"></div></section><section class="panel"><div class="panel-heading"><h2>Served endpoints</h2></div><div id="health-endpoints" class="endpoint-list"></div></section></div>
    </section>
  </template>

  <template id="page-audit">
    <section class="page">
      <div class="page-heading action-heading"><div><h1>Audit Logs</h1><p>Eventi di autenticazione e operazioni amministrative</p></div><button id="refresh-audit" class="btn btn-secondary">Aggiorna</button></div>
      <section class="panel"><div class="table-shell"><table><thead><tr><th>UTC</th><th>Action</th><th>Actor</th><th>Target</th><th>Details</th></tr></thead><tbody id="audit-body"></tbody></table></div></section>
    </section>
  </template>

  <template id="page-contact">
    <section class="page">
      <div class="page-heading"><div><h1>Contatti</h1><p>Hai una domanda, vuoi segnalare un problema o proporre un miglioramento? Invia un messaggio direttamente al team.</p></div></div>
      <div class="split-grid">
        <section class="panel">
          <div class="panel-heading"><div><h2>Invia un messaggio</h2><p class="microcopy">Compila il form e descrivi la tua richiesta nel modo più dettagliato possibile.</p></div></div>
          <form class="form-grid" id="contact-form">
            <label>Nome<input name="name" type="text" autocomplete="name" placeholder="Il tuo nome" required></label>
            <label>Email<input name="email" type="email" autocomplete="email" placeholder="nome@azienda.it" required></label>
            <label class="span-2">Oggetto<input name="subject" type="text" placeholder="Come possiamo aiutarti?" required></label>
            <label class="span-2">Messaggio<textarea name="message" rows="8" placeholder="Scrivi qui il tuo messaggio..." required></textarea></label>
            <div class="span-2 button-row" style="align-items:center;justify-content:space-between">
              <span class="microcopy"><strong>Privacy:</strong> i dati saranno usati esclusivamente per rispondere alla richiesta.</span>
              <button class="btn btn-primary" type="submit">Apri client email</button>
            </div>
            <p class="span-2 microcopy">Compilando e inviando, si apre il tuo client di posta con i campi già pronti verso il team operativo. Nessun dato viene inviato direttamente da questa pagina finché non è collegato un backend reale.</p>
          </form>
          <script>
            document.getElementById('contact-form').addEventListener('submit', function(e){
              e.preventDefault();
              const f = new FormData(this);
              const subject = encodeURIComponent(f.get('subject') || 'Richiesta da AI Model Control Center');
              const body = encodeURIComponent(`Da: ${f.get('name')} <${f.get('email')}>\n\n${f.get('message')}`);
              window.location.href = `mailto:support@bballstat.com?subject=${subject}&body=${body}`;
            });
          </script>
        </section>
        <aside class="panel">
          <div class="panel-heading"><h2>Prima di scriverci</h2></div>
          <div class="summary-list">
            <div class="summary-row"><span>Problemi tecnici</span><strong>Indica pagina ed errore</strong></div>
            <div class="summary-row"><span>Funzionalità</span><strong>Descrivi il risultato atteso</strong></div>
            <div class="summary-row"><span>Oggetto</span><strong>Usa un titolo chiaro</strong></div>
          </div>
        </aside>
      </div>
    </section>
  </template>

  <template id="page-settings">
    <section class="page">
      <div class="page-heading"><div><h1>Settings</h1><p>Runtime, promotion gates e sicurezza dell'account</p></div></div>
      <div class="split-grid"><section class="panel"><div class="panel-heading"><h2>Runtime</h2></div><div id="runtime-settings" class="settings-list"></div></section><section class="panel"><div class="panel-heading"><h2>Promotion gates</h2></div><div id="promotion-settings" class="settings-list"></div></section></div>
      <section class="panel password-panel"><div class="panel-heading"><h2>Cambia password</h2></div><form id="password-form" class="password-form"><label>Password attuale<input name="old_password" type="password" required></label><label>Nuova password<input name="new_password" type="password" required></label><button class="btn btn-primary" type="submit">Aggiorna password</button></form><p class="microcopy">Dopo il cambio password tutte le sessioni attive vengono revocate.</p></section>
    </section>
  </template>

  <script src="/assets/app.js" defer></script>
</body>
</html>
